name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json versions)'
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release v${{ github.event.inputs.version }}
    runs-on: [self-hosted, akash]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: 📦 Install GitHub CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1

      - name: Validate Release
        run: node scripts/validate-release.js

      - name: Install Dependencies
        run: pnpm install

      - name: Build Packages
        run: pnpm run build

      - name: Publish to npm
        run: pnpm publish -r --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        run: |
          VERSION=${{ github.event.inputs.version }}
          git tag v${VERSION}
          git push origin v${VERSION}

      - name: Create GitHub Release
        run: |
          VERSION=${{ github.event.inputs.version }}
          gh release create v${VERSION} \
            --title "Release v${VERSION}" \
            --notes "## Packages Released

- @cryptoandcoffee/akash-jsdk-core@${VERSION}
- @cryptoandcoffee/akash-jsdk-cli@${VERSION}
- @cryptoandcoffee/akash-jsdk-react@${VERSION}
- @cryptoandcoffee/akash-jsdk-protobuf@${VERSION}

All packages synchronized and published atomically."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README
        run: node scripts/update-readme-versions.js

      - name: Commit README updates
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README.md with latest package versions [skip ci]"
            git push
          fi
