name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'packages/*/package.json'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-and-release:
    name: Validate and Release
    runs-on: [self-hosted, akash]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install GitHub CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1

      - name: Validate Release
        id: validate
        continue-on-error: true
        run: node scripts/validate-release.js

      - name: Install Dependencies
        if: steps.validate.outcome == 'success'
        run: pnpm install

      - name: Build Packages
        if: steps.validate.outcome == 'success'
        run: pnpm run build

      - name: Publish to npm
        if: steps.validate.outcome == 'success'
        run: pnpm publish -r --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract Version
        if: steps.validate.outcome == 'success'
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create git tag
        if: steps.validate.outcome == 'success'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git tag v${VERSION}
          git push origin v${VERSION}

      - name: Create GitHub Release
        if: steps.validate.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NOTES="## Packages Released\n\n- @cryptoandcoffee/akash-jsdk-core@${VERSION}\n- @cryptoandcoffee/akash-jsdk-cli@${VERSION}\n- @cryptoandcoffee/akash-jsdk-react@${VERSION}\n- @cryptoandcoffee/akash-jsdk-protobuf@${VERSION}\n\nAll packages synchronized and published atomically."
          gh release create v${VERSION} --title "Release v${VERSION}" --notes "${NOTES}"

      - name: Update README
        if: steps.validate.outcome == 'success'
        run: node scripts/update-readme-versions.js

      - name: Commit README updates
        if: steps.validate.outcome == 'success'
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README.md with latest package versions [skip ci]"
            git push
          fi
